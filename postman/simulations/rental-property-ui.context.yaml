purpose:
  stands_in_for: Local synthetic Rental Property API; see rental-property-ui.context.md for prior evidence.
  unblocks: Angular search and hierarchy picker verification without changing the production API target.
assumptions:
  - id: listing-create-with-boost
    status: supported
    claim: The Angular create dialog sends the purchased Boost subscription and level in the same listing request, previews remaining credits and displays the pending selection.
    reason: The production Angular build was exercised against synthetic responses based on ListingRequest, ListingResponse and ActiveBoostResponse. The simulation establishes frontend HTTP wiring; backend accounting is checked separately against MySQL.
    verification: On 2026-11-02, rental-listing-boost.smoke.cjs passed in headless Edge at 1440px and 390px. Observed subscriptions/current, boost-subscriptions/active, properties/mine and POST listings request events in .angular/listing-boost-sim.ndjson. Verified high/low selection, low fallback, 409 handling without losing input, single create payload and pending Boost display. PackageCatalogApiTest separately passed 80 API tests including refund, rollback and last-credit concurrency. The synthetic handler does not establish payment-provider behavior.
    source: postman/simulations/rental-listing-boost.smoke.cjs; postman/mocks/rental-property/default.js; src/app/features/listing/components/listing-editor/; ../DOANTOTNGHIEPBE/src/test/java/com/tamdaptit/rentalmanagement/subscription/PackageCatalogApiTest.java
    updated_at: "2026-11-02"
  - id: booking-availability-response
    status: supported
    claim: Room responses now expose bookingAvailability; Angular booking and available counts use that server field.
    reason: The rental workflow adds HELD without changing rentalStatus. The existing property mock has no rental agreements and only models availability equal to its physical room status.
    verification: Inspected RoomResponse, RentalAvailabilityService and PropertyMapper on 2026-10-29. Updated the synthetic room factory to include bookingAvailability. This does not establish booking, concurrency or PDF behavior through the simulation; those use separate MySQL and Angular tests.
    source: postman/mocks/rental-property/default.js; src/app/core/models/property/property.mapper.ts; ../DOANTOTNGHIEPBE/src/main/java/com/tamdaptit/rentalmanagement/rental/service/RentalAvailabilityService.java
    updated_at: "2026-10-29"
  - id: consolidated-search-query
    status: supported
    claim: In the 2026-10-29 synthetic run, the consolidated search submitted provinceId, wardId, roomTypeName, minPrice, maxPrice, rentalStatus and amenityNames together after clicking Find rooms.
    reason: The production Angular build generated the expected HTTP query, displayed the fixture result and kept applied filter labels synchronized after individual removal and reset.
    verification: Local headless Edge check in .angular/search-login-redesign-check.cjs passed against the simulation on 4907 and production preview on 4207. Request events in .angular/search-redesign-sim.ndjson confirmed catalog, ward and listing calls. Draft selection made no listing request; removing a province also removed its ward. Nine existing unit tests and the public picker smoke passed.
    source: src/app/features/landing/components/search-capsule/; src/app/features/landing/pages/landing-page/; postman/mocks/rental-property/default.js; postman/simulations/rental-room-type-picker.smoke.cjs
    updated_at: "2026-10-29"
  - id: real-provider-filter-semantics
    status: unknown
    claim: Real backend search results match every combination of amenities and hierarchical room types shown by the new search form.
    reason: The UI change preserves the existing API contract. The synthetic handler checks room names, areas, prices and availability but does not model all amenity or ancestor-selection semantics.
    verification: Confirmed outgoing parameter names against PublicListingService and ListingSearchRequest. No live backend or database run was performed; simulation results establish caller wiring only.
    source: src/app/core/services/public-listing.service.ts; ../DOANTOTNGHIEPBE/src/main/java/com/tamdaptit/rentalmanagement/listing/dto/request/ListingSearchRequest.java; postman/mocks/rental-property/default.js
    updated_at: "2026-10-29"
fingerprints:
