services:
  library-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-frontend:latest
    container_name: library-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    # Development compose. Production keeps nginx.conf + its TLS certificate mounts.
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
