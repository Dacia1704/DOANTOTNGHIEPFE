version: '3.8'

services:
  library-frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: library-frontend:latest
    container_name: library-frontend
    ports:
      - "80:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
