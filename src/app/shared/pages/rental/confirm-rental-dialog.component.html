<div class="dialog-heading">
  <span class="dialog-icon material-symbols-outlined" aria-hidden="true">fact_check</span>
  <p>XÁC NHẬN THAO TÁC</p>
  <h2 mat-dialog-title>{{ data.title }}</h2>
</div>
<mat-dialog-content>
  <p class="dialog-message">{{ data.message }}</p>
  @if (data.reason) {
    <label class="reason-label"
      >Lý do <span>(không bắt buộc)</span>
      <textarea
        class="input"
        [(ngModel)]="reason"
        maxlength="500"
        rows="3"
        placeholder="Chia sẻ lý do để người thuê được biết…"
      ></textarea>
    </label>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button class="btn-secondary" [mat-dialog-close]="null">Quay lại</button>
  <button class="btn-primary" [mat-dialog-close]="{ reason }">
    Xác nhận<span class="material-symbols-outlined" aria-hidden="true">arrow_forward</span>
  </button>
</mat-dialog-actions>
