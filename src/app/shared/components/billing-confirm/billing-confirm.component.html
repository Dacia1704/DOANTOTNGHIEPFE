<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content
  ><p>{{ data.message }}</p></mat-dialog-content
>
<mat-dialog-actions align="end">
  <button type="button" [mat-dialog-close]="false">Quay lại</button>
  <button type="button" class="primary" [mat-dialog-close]="true">{{ data.action }}</button>
</mat-dialog-actions>
