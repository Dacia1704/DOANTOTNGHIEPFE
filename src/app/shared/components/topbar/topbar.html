<header class="topbar">

  <!-- Left: Search hint -->
  <div class="topbar-left">
    <!-- <div class="search-hint">
      <span class="material-symbols-outlined search-hint-icon">manage_search</span>
      <span class="search-hint-text">Nhấn Ctrl + K để tìm kiếm nhanh...</span>
    </div> -->
  </div>

  <!-- Right: Actions + User -->
  <div class="topbar-right">

    <!-- Notifications -->
    <button class="icon-btn notif-btn" 
            title="Thông báo" 
            type="button"
            (click)="toggleNotifications()"
            [matBadge]="unreadCount()"
            [matBadgeHidden]="unreadCount() === 0"
            matBadgeColor="warn"
            matBadgeSize="small">
      <span class="material-symbols-outlined">notifications</span>
    </button>

    <!-- Notification dropdown panel -->
    @if (showNotifications()) {
      <div class="notification-panel">
        <div class="notif-header">
          <h4>Thông báo</h4>
        </div>
        
        <mat-divider></mat-divider>
        
        @if (notifications.length === 0) {
          <div class="notif-empty">
            <span class="material-symbols-outlined">notifications_none</span>
            <p>Không có thông báo nào</p>
          </div>
        } @else {
          <div class="notif-list">
            
          </div>
        }
      </div>
    }

    <!-- Help -->
    <!-- <button class="icon-btn" title="Trợ giúp" type="button">
      <span class="material-symbols-outlined">help_outline</span>
    </button> -->

    <div class="vr"></div>

    <!-- User -->
    <div class="user-trigger" [matMenuTriggerFor]="userMenu">
      <img
        class="user-avatar"
        [src]="userAvatar"
        [alt]="userName"
      />
      <div class="user-meta">
        <span class="user-name">{{ userName || 'Bạn đọc' }}</span>
        <span class="user-role-label">{{ userRole || 'Thành viên' }}</span>
      </div>
      <span class="material-symbols-outlined chevron">expand_more</span>
    </div>

    <!-- User dropdown -->
    <mat-menu #userMenu="matMenu" class="user-menu">
      <button mat-menu-item (click)="goToProfile.emit()" *ngIf="userBaseRole === 'MEMBER' || userBaseRole === 'READER'">
        <span class="material-symbols-outlined mi">person</span>
        Hồ sơ cá nhân
      </button>
      <button mat-menu-item (click)="goToMemberCard.emit()" *ngIf="userBaseRole === 'MEMBER' || userBaseRole === 'READER'">
        <span class="material-symbols-outlined mi">person</span>
        Thẻ thành viên
      </button>
      <button mat-menu-item>
        <span class="material-symbols-outlined mi">settings</span>
        Cài đặt tài khoản
      </button>
      <mat-divider />
      <button mat-menu-item class="logout-item" (click)="logoutClick.emit()">
        <span class="material-symbols-outlined mi">logout</span>
        Đăng xuất
      </button>
    </mat-menu>

  </div>
</header>
