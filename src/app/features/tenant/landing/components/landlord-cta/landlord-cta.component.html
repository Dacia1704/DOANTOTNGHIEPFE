<section class="landlord-cta" aria-labelledby="host-title">
  <div class="landlord-cta__content">
    <div class="landlord-cta__chip">
      <span class="material-symbols-outlined" aria-hidden="true">real_estate_agent</span>Dành cho
      Chủ trọ & Đơn vị vận hành căn hộ
    </div>
    <h2 id="host-title">Bạn có phòng trống muốn cho thuê nhanh?</h2>
    <p>
      Đưa phòng của bạn đến gần hơn với sinh viên và người đi làm đang tìm nơi ở. Quản lý tin đăng,
      trao đổi với người thuê và theo dõi hợp đồng ngay trên Trọ Tốt.
    </p>
    <div class="landlord-cta__actions">
      <button type="button" class="landlord-cta__primary" (click)="navigateTo('dang-tin')">
        <span class="material-symbols-outlined" aria-hidden="true">publish</span>Đăng tin cho thuê
        ngay
      </button>
      <button type="button" class="landlord-cta__secondary" (click)="navigateTo('goi-dich-vu')">
        Xem bảng giá dịch vụ
      </button>
    </div>
  </div>
  <span class="landlord-cta__decoration material-symbols-outlined" aria-hidden="true"
    >holiday_village</span
  >
</section>
