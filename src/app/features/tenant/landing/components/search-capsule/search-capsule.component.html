<form
  class="search-capsule"
  (submit)="onSubmit($event)"
  aria-label="Tìm phòng trọ"
  [attr.aria-busy]="searching"
>
  <div class="search-capsule__bar">
    <app-filter-select
      label="Khu vực tìm kiếm"
      icon="school"
      [options]="provinceOptions()"
      [value]="provinceId()"
      (valueChange)="onProvinceChange($event)"
    />
    <app-filter-select
      label="Khoảng giá / tháng"
      icon="payments"
      [options]="priceOptions"
      [value]="priceRange()"
      (valueChange)="priceRange.set($event)"
    />
    <app-category-bar
      [selectedRoomType]="roomTypeName()"
      (typeSelected)="roomTypeName.set($event)"
    />
    <button type="submit" class="search-capsule__submit" [disabled]="searching">
      <span class="material-symbols-outlined" aria-hidden="true">search</span
      >{{ searching ? 'Đang tìm…' : 'Tìm phòng' }}
    </button>
  </div>
  <div class="search-capsule__quick">
    <span
      ><span class="material-symbols-outlined" aria-hidden="true">trending_up</span>Tìm nhanh:</span
    >
    <button
      type="button"
      [attr.aria-pressed]="priceRange() === 'under3'"
      (click)="priceRange.set('under3'); onSubmit($event)"
    >
      Dưới 3 triệu
    </button>
    @for (amenity of amenities().slice(0, 4); track amenity.id) {
      <button
        type="button"
        [attr.aria-pressed]="selectedAmenityNames().includes(amenity.name)"
        (click)="
          toggleAmenity(amenity.name, !selectedAmenityNames().includes(amenity.name));
          onSubmit($event)
        "
      >
        {{ amenity.name }}
      </button>
    }
    <button
      type="button"
      class="search-capsule__more"
      [attr.aria-expanded]="showAmenities()"
      aria-controls="advanced-search"
      (click)="showAmenities.set(!showAmenities())"
    >
      <span class="material-symbols-outlined" aria-hidden="true">tune</span>Bộ lọc nâng cao
    </button>
  </div>
  @if (showAmenities()) {
    <div id="advanced-search" class="search-capsule__advanced">
      @if (provinceId()) {
        <app-filter-select
          label="Phường / xã"
          icon="map"
          [options]="wardOptions()"
          [value]="wardId()"
          (valueChange)="wardId.set($event)"
        />
      }
      <fieldset>
        <legend>Tiện ích mong muốn</legend>
        <div class="search-capsule__amenities">
          @for (amenity of amenities(); track amenity.id) {
            <label
              ><input
                type="checkbox"
                [checked]="selectedAmenityNames().includes(amenity.name)"
                (change)="toggleAmenity(amenity.name, $any($event.target).checked)"
              />{{ amenity.name }}</label
            >
          } @empty {
            <p>Chưa tải được tiện ích. Bạn vẫn có thể tìm theo khu vực và giá.</p>
          }
        </div>
      </fieldset>
      <div class="search-capsule__footer">
        <label
          ><input
            type="checkbox"
            [checked]="rentalStatus() !== ''"
            (change)="onAvailabilityChange($any($event.target).checked)"
          />Chỉ hiển thị phòng còn trống</label
        >
        <button type="button" (click)="resetFilters()" [disabled]="searching">Đặt lại</button>
        <button type="submit" class="search-capsule__submit" [disabled]="searching">
          Áp dụng bộ lọc
        </button>
      </div>
    </div>
  }
</form>
