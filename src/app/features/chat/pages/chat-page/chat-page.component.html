<div class="chat-layout">
  <!-- LEFT: Conversation Sidebar -->
  <aside class="chat-sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">Tin nhắn</h2>
      <button class="new-chat-btn" (click)="contactSupport()" [disabled]="loadingSupport" title="Liên hệ Admin hỗ trợ">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
        </svg>
      </button>
    </div>

    <!-- Conversation List -->
    <app-conversation-list
      [conversations]="conversations"
      [activeId]="activeConversation?.id ?? null"
      [loading]="loadingConversations"
      (selectConversation)="selectConversation($event)"
    />
  </aside>

  <!-- RIGHT: Chat Window -->
  <main class="chat-main">
    @if (activeConversation) {
      <app-chat-window
        [conversation]="activeConversation"
        [messages]="messages"
        [loading]="loadingMessages"
        [currentUserId]="currentUserId"
        [hasMore]="messages.length < messageTotal"
        [showHeader]="true"
        (sendMessage)="sendMessage($event)"
        (loadMore)="loadMoreMessages()"
      />
    } @else {
      <div class="chat-empty">
        <div class="chat-empty-icon">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <h3>Hộp thư hỗ trợ & trao đổi</h3>
        <p>Chọn một cuộc trò chuyện từ danh sách hoặc liên hệ ngay với Quản trị viên để được hỗ trợ.</p>
        <button class="btn-start-chat" (click)="contactSupport()" [disabled]="loadingSupport">
          {{ loadingSupport ? 'Đang kết nối...' : 'Liên hệ Admin hỗ trợ' }}
        </button>
      </div>
    }
  </main>
</div>
