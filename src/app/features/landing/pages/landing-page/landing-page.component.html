<div class="landing">
  <div class="landing__inner">
    <section class="hero" aria-labelledby="landing-title">
      <div class="hero__copy">
        <span class="hero__eyebrow"
          ><span class="material-symbols-outlined" aria-hidden="true">home_work</span>MỘT NƠI Ở, MỘT
          KHỞI ĐẦU MỚI</span
        >
        <h1 id="landing-title" class="hero__title">Tìm nơi ở <span>hợp với bạn.</span></h1>
        <p class="hero__sub">
          Từ căn phòng đầu tiên đến một tổ ấm mới. Chọn khu vực, ngân sách và những điều bạn cần.
        </p>
      </div>
      <app-search-capsule
        [appliedFilters]="activeQuery()"
        [searching]="searching()"
        (locationLabels)="locationLabels.set($event)"
        (search)="searchRooms($event)"
      />
    </section>

    @if (searchError()) {
      <p class="landing__error" role="alert">
        <span class="material-symbols-outlined" aria-hidden="true">error</span>{{ searchError() }}
      </p>
    }
    @if (filterChips().length) {
      <div class="applied-filters" aria-label="Bộ lọc đang áp dụng">
        <span class="applied-filters__label">Đang lọc:</span>
        @for (chip of filterChips(); track chip.key) {
          <button
            type="button"
            [attr.aria-label]="'Bỏ lọc ' + chip.label"
            (click)="removeFilter(chip.key)"
          >
            {{ chip.label }}<span class="material-symbols-outlined" aria-hidden="true">close</span>
          </button>
        }
        <button type="button" class="applied-filters__clear" (click)="resetFilters()">
          Xóa tất cả
        </button>
      </div>
    }
    <app-room-grid
      [result]="rooms()"
      [loading]="searching()"
      (loadMore)="loadMore()"
      (roomSelected)="openRoom($event)"
    />
    <app-landlord-cta />
  </div>
</div>
