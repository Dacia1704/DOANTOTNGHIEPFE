<nav class="category-bar" aria-label="Lọc theo loại phòng">
  <div class="category-bar__scroll">
    <button type="button" class="category-bar__pill" [class.is-active]="!selectedName()" (click)="select('')">
      <span class="material-symbols-outlined">apps</span><span>Tất cả phòng</span>
    </button>
    @for (type of roomTypes(); track type.id) {
      <button type="button" class="category-bar__pill" [class.is-active]="selectedName() === type.name" (click)="select(type.name)">
        <span class="material-symbols-outlined">apartment</span><span>{{ type.name }}</span>
      </button>
    }
    @if (!roomTypes().length) { <span class="category-bar__empty">Chưa tải được loại phòng</span> }
  </div>
</nav>
