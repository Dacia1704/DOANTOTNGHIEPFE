<section class="users-page management-page" aria-labelledby="users-heading">
  <h1 id="users-heading">Quản lý người dùng</h1>
  <p class="description">Tra cứu tài khoản, vai trò và trạng thái hoạt động.</p>
  @if (success()) {
    <p class="success" role="status">{{ success() }}</p>
  }

  <app-management-table
    [rows]="result()?.items ?? []"
    [columns]="columns"
    [rowKey]="rowKey"
    caption="Danh sách người dùng"
    [loading]="loading()"
    [error]="error()"
    [pagination]="pagination()"
    [pageSize]="pageSize()"
    (pageChange)="load($event)"
    (pageSizeChange)="changePageSize($event)"
    (retry)="load()"
    emptyMessage="Không tìm thấy người dùng phù hợp."
  >
    <form tableToolbar class="management-filters" [formGroup]="filters" (ngSubmit)="search()">
      <label for="user-search"
        >Tìm kiếm
        <input
          class="input"
          id="user-search"
          formControlName="q"
          placeholder="Tìm người dùng…"
          type="search"
        />
      </label>
      <label for="user-status"
        >Trạng thái
        <select class="input" id="user-status" formControlName="status">
          <option value="">Tất cả trạng thái</option>
          <option value="ACTIVE">Đang hoạt động</option>
          <option value="INACTIVE">Chưa hoạt động</option>
          <option value="BLOCKED">Đã bị khóa</option>
        </select>
      </label>
      <button class="btn-primary" type="submit" [disabled]="loading()">Tìm kiếm</button>
    </form>
    <ng-template [appTableCell]="result()?.items ?? []" column="roles" let-user>
      @for (role of user.roles; track role) {
        <span class="role">{{ roles[role] }}</span>
      }
    </ng-template>
    <ng-template [appTableCell]="result()?.items ?? []" column="actions" let-user>
      <div class="row-actions">
        <button
          type="button"
          class="btn-secondary"
          [attr.aria-label]="'Sửa người dùng ' + user.fullName"
          (click)="openAction(user, 'edit')"
        >
          Sửa
        </button>
        <button
          type="button"
          class="btn-danger"
          [attr.aria-label]="'Xóa người dùng ' + user.fullName"
          (click)="openAction(user, 'delete')"
        >
          Xóa
        </button>
      </div>
    </ng-template>
  </app-management-table>
</section>
