<section class="amenities-page management-page" aria-labelledby="amenities-heading">
  <!-- Page Header -->
  <header class="page-header">
    <div class="header-left">
      <h1 id="amenities-heading" class="headline-lg">Quản lý tiện ích phòng</h1>
      <p class="body-md text-secondary">
        Danh sách các tiện ích phòng trọ (điều hòa, wifi, bếp, ban công...) phục vụ đăng tin và lọc
        tìm kiếm.
      </p>
    </div>
    <div class="header-right">
      <button type="button" class="btn-primary" (click)="openCreate()">
        <span class="material-symbols-outlined">add_circle</span>
        <span>Thêm tiện ích</span>
      </button>
    </div>
  </header>

  <!-- Success Notification -->
  @if (success()) {
    <div class="alert-success" role="status">
      <span class="material-symbols-outlined">check_circle</span>
      <span>{{ success() }}</span>
    </div>
  }

  <app-management-table
    [rows]="filteredItems()"
    [columns]="columns"
    [rowKey]="rowKey"
    caption="Danh sách tiện ích"
    [loading]="loading()"
    [error]="error()"
    [pagination]="pagination()"
    [pageSize]="pageSize()"
    (pageChange)="load($event)"
    (pageSizeChange)="changePageSize($event)"
    (retry)="load()"
    emptyMessage="Không tìm thấy tiện ích nào phù hợp."
  >
    <div tableToolbar class="management-filters">
      <label class="filter-search"
        >Tìm tiện ích
        <input
          type="search"
          [formControl]="searchControl"
          placeholder="Tìm kiếm tiện ích theo tên…"
          aria-label="Tìm kiếm tiện ích"
        /> </label
      ><button type="button" class="btn-secondary" (click)="searchControl.setValue('')">
        Xóa bộ lọc
      </button>
    </div>
    <ng-template [appTableCell]="filteredItems()" column="icon" let-item
      ><span class="material-symbols-outlined" aria-hidden="true">{{
        item.icon
      }}</span></ng-template
    >
    <ng-template [appTableCell]="filteredItems()" column="actions" let-item>
      <div class="row-actions">
        <button
          type="button"
          class="btn-secondary btn-sm"
          (click)="openEdit(item)"
          [attr.aria-label]="'Chỉnh sửa tiện ích ' + item.name"
        >
          <span class="material-symbols-outlined">edit</span>
          <span>Sửa</span>
        </button>

        <button
          type="button"
          class="btn-danger btn-sm"
          (click)="openDelete(item)"
          [attr.aria-label]="'Xóa tiện ích ' + item.name"
        >
          <span class="material-symbols-outlined">delete</span>
          <span>Xóa</span>
        </button>
      </div>
    </ng-template>
  </app-management-table>
</section>
