<section class="wards-page management-page" aria-labelledby="wards-heading">
  <div class="page-heading">
    <div>
      <h1 id="wards-heading">Quản lý phường/xã</h1>
      <p class="description">Tra cứu và quản lý phường/xã theo tỉnh, thành phố.</p>
    </div>
    <button
      class="btn-primary"
      type="button"
      [disabled]="loading() || provincesLoading() || !!provinceError()"
      (click)="open('create')"
    >
      Thêm phường/xã
    </button>
  </div>
  @if (success()) {
    <p class="success" role="status">{{ success() }}</p>
  }
  @if (provinceError()) {
    <div class="error" role="alert">
      {{ provinceError() }}
      <button class="btn-secondary" type="button" (click)="loadProvinces()">Thử lại</button>
    </div>
  }

  <app-management-table
    [rows]="result()?.data ?? []"
    [columns]="columns"
    [rowKey]="rowKey"
    caption="Danh sách phường/xã"
    [loading]="loading()"
    [error]="error()"
    [pagination]="pagination()"
    [pageSize]="pageSize()"
    (pageChange)="load($event)"
    (pageSizeChange)="changePageSize($event)"
    (retry)="load()"
    emptyMessage="Không có phường/xã phù hợp. Hãy thử thay đổi bộ lọc hoặc thêm phường/xã mới."
  >
    <form tableToolbar class="management-filters" [formGroup]="filters" (ngSubmit)="search()">
      <label for="ward-search"
        >Tìm kiếm
        <input
          class="input"
          id="ward-search"
          type="search"
          formControlName="q"
          maxlength="100"
          placeholder="Nhập tên hoặc mã phường/xã"
        />
      </label>
      <label for="ward-province"
        >Tỉnh/Thành phố
        <select class="input" id="ward-province" formControlName="provinceId">
          <option value="">
            {{ provincesLoading() ? 'Đang tải tỉnh/thành phố…' : 'Tất cả tỉnh/thành phố' }}
          </option>
          @for (province of provinces(); track province.id) {
            <option [value]="province.id">{{ province.name }}</option>
          }
        </select>
      </label>
      <button class="btn-primary" type="submit" [disabled]="loading()">Tìm kiếm</button>
      <button class="btn-secondary" type="button" [disabled]="loading()" (click)="reset()">
        Đặt lại
      </button>
    </form>
    <ng-template [appTableCell]="result()?.data ?? []" column="actions" let-ward>
      <div class="row-actions">
        <button
          class="btn-secondary"
          type="button"
          [disabled]="provincesLoading() || !!provinceError()"
          [attr.aria-label]="'Sửa ' + ward.name"
          (click)="open('edit', ward)"
        >
          Sửa
        </button>
        <button
          class="btn-danger"
          type="button"
          [attr.aria-label]="'Xóa ' + ward.name"
          (click)="open('delete', ward)"
        >
          Xóa
        </button>
      </div>
    </ng-template>
  </app-management-table>
</section>
