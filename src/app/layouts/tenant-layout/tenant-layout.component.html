<div class="tenant-layout">
  <app-site-header />

  <main class="tenant-layout__main">
    <router-outlet />
  </main>

  <app-site-footer />

  <app-mobile-bottom-nav />
  @if (!router.url.startsWith('/tin-nhan') && !router.url.startsWith('/login') && !router.url.startsWith('/register')) {
    <a class="support-launcher" routerLink="/tin-nhan" [queryParams]="{ support: '1' }" aria-label="Chat hỗ trợ với quản trị viên"><span class="material-symbols-outlined" aria-hidden="true">support_agent</span><span>Chat hỗ trợ</span></a>
  }
</div>
