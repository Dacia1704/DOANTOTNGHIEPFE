<div class="tenant-layout">
  <app-site-header />

  <main class="tenant-layout__main">
    <router-outlet />
  </main>

  <app-site-footer />

  <app-mobile-bottom-nav />
  @if (
    canContactSupport &&
    !chatWidget.opened() &&
    !router.url.startsWith('/tin-nhan') &&
    !router.url.startsWith('/login') &&
    !router.url.startsWith('/register')
  ) {
    <button
      type="button"
      class="support-launcher"
      (click)="chatWidget.openSupport()"
      aria-label="Chat hỗ trợ với quản trị viên"
      aria-haspopup="dialog"
      aria-controls="chat-widget"
      title="Chat hỗ trợ"
    >
      <span class="material-symbols-outlined" aria-hidden="true">support_agent</span>
    </button>
  }
</div>
